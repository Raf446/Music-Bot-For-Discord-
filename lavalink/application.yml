server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    cookieFile: "cookies.txt"
    clients:
      - WEB
      - MUSIC
      - ANDROID
    oauth:
      enabled: false
  lavasrc:
    providers:
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
    spotify:
      clientId: "2abb1d0b1e1740968764a99f727a7435"
      clientSecret: "d6775d397d694a669e1a6eda2fe917ef"
      spDc: "AQBMS736xAK-_FU77QUPaqylrpOTZyQXHqGGiVQfF0dAwEdUKIGpPlMRKhazYm9mlrFUnrVNVVkv8rvWyAGuIfyHDLHOx6yHtT8gh4P35JX1vXPLjauBXgtE_mI61DVFv-8yBgAamKYI0z0Fud5xTB0eKypMt9YIKrncj0_oqd23lGZVjRnPFdCdX1Rh2rm-TSgeHFSFNVN23_pGDw"
      countryCode: "ID"
      playlistLoadLimit: 50
      albumLoadLimit: 50

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30